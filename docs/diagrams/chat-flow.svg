ter-spacing="0.06em">SEARCH</text><rect x="744" y="260" width="56" height="12" rx="2" fill="#ecebe7"/><text x="772" y="269" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">PASSAGES</text><rect x="570" y="308" width="44" height="12" rx="2" fill="#ecebe7"/><text x="592" y="317" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">PROMPT</text><rect x="560" y="408" width="64" height="12" rx="2" fill="#ecebe7"/><text x="592" y="417" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text><rect x="570" y="528" width="44" height="12" rx="2" fill="#ecebe7"/><text x="592" y="537" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">RESULT</text><rect x="570" y="600" width="44" height="12" rx="2" fill="#ecebe7"/><text x="592" y="609" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">ANSWER</text><rect x="354" y="644" width="92" height="12" rx="2" fill="#ecebe7"/><text x="400" y="653" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">REPLY, SOURCES</text><rect x="164" y="688" width="88" height="12" rx="2" fill="#ecebe7"/><text x="208" y="697" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">STREAM EVENTS</text><path d="M500,476 L528,476 Q536,476 536,484 L536,492 Q536,500 528,500 L500,500" fill="none" stroke="#5d683a" stroke-width="1.2" marker-end="url(#chat-flow-arrow)"/><rect x="544" y="482" width="56" height="12" rx="2" fill="#ecebe7"/><text x="572" y="491" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">RUN TOOL</text><rect x="40" y="32" width="144" height="48" rx="6" fill="#ecebe7"/><rect x="40" y="32" width="144" height="48" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="112" y="60" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Student's browser</text><rect x="232" y="32" width="144" height="48" rx="6" fill="#ecebe7"/><rect x="232" y="32" width="144" height="48" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="304" y="60" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">API</text><rect x="424" y="32" width="144" height="48" rx="6" fill="#ecebe7"/><rect x="424" y="32" width="144" height="48" rx="6" fill="#38450f" stroke="#38450f" stroke-width="1.2"/><text x="496" y="60" fill="#ecebe7" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Agent</text><rect x="616" y="32" width="144" height="48" rx="6" fill="#ecebe7"/><rect x="616" y="32" width="144" height="48" rx="6" fill="#38450f" fill-opacity="0.03" stroke="#5d683a" stroke-width="1" stroke-dasharray="4,3"/><text x="688" y="60" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Language model</text><rect x="784" y="32" width="144" height="48" rx="6" fill="#ecebe7"/><rect x="784" y="32" width="144" height="48" rx="6" fill="#38450f" fill-opacity="0.08" stroke="#5d683a" stroke-width="1"/><text x="856" y="60" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Knowledge store</text>
