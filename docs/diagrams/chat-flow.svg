<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 804" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-flow-title chat-flow-desc" id="chat-flow-root">
        <title id="chat-flow-title">How a chat question is answered</title>
        <desc id="chat-flow-desc">Sequence of a chat question: the browser asks the API, the agent searches the knowledge store, asks the language model, runs any tool it requests, and the reply streams back to the browser.</desc>
        <defs>
      <style>#chat-flow-root { font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #38450f; }
      #chat-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #chat-flow-root .diagram-container { overflow-x: visible; }</style><marker id="chat-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d683a"/></marker><marker id="chat-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#38450f"/></marker><marker id="chat-flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5d683a" stroke-width="1.2"/></marker></defs>
        <rect x="0" y="0" width="960" height="804" fill="#ecebe7"/>
        <line x1="112" y1="80" x2="112" y2="736" stroke="#38450f" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3,3"/><line x1="304" y1="80" x2="304" y2="736" stroke="#38450f" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3,3"/><line x1="496" y1="80" x2="496" y2="736" stroke="#38450f" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3,3"/><line x1="688" y1="80" x2="688" y2="736" stroke="#38450f" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3,3"/><line x1="856" y1="80" x2="856" y2="736" stroke="#38450f" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3,3"/><rect x="464" y="352" width="264" height="224" rx="4" fill="#38450f" fill-opacity="0.02" stroke="#38450f" stroke-opacity="0.28" stroke-width="1"/><rect x="464" y="352" width="40" height="16" rx="2" fill="#ecebe7" stroke="#38450f" stroke-opacity="0.28" stroke-width="1"/><text x="484" y="364" fill="#5d683a" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.12em">LOOP</text><text x="512" y="388" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.04em">[until the model gives an answer]</text><rect x="108" y="148" width="8" height="560" fill="#38450f" fill-opacity="0.06" stroke="#5d683a" stroke-width="0.8"/><rect x="300" y="148" width="8" height="560" fill="#38450f" fill-opacity="0.06" stroke="#5d683a" stroke-width="0.8"/><rect x="492" y="192" width="8" height="472" fill="#38450f" fill-opacity="0.06" stroke="#5d683a" stroke-width="0.8"/><rect x="852" y="236" width="8" height="44" fill="#38450f" fill-opacity="0.06" stroke="#5d683a" stroke-width="0.8"/><rect x="684" y="328" width="8" height="292" fill="#38450f" fill-opacity="0.06" stroke="#5d683a" stroke-width="0.8"/><line x1="116" y1="148" x2="300" y2="148" stroke="#5d683a" stroke-width="1.2" marke