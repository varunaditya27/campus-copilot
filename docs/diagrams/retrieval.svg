<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 80 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc" id="retrieval-root">
        <title id="retrieval-title">How campus documents are retrieved</title>
        <desc id="retrieval-desc">A question is searched by meaning and by words, the two lists are merged and reranked, and only passages scoring above the cutoff reach the prompt.</desc>
        <defs>
      <style>#retrieval-root { font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #38450f; }
      #retrieval-root .diagram-container { width: 100%; overflow-x: auto; }
      #retrieval-root .diagram-container { overflow-x: visible; }</style><marker id="retrieval-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d683a"/></marker><marker id="retrieval-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#38450f"/></marker><marker id="retrieval-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5d683a" stroke-width="1.2"/></marker></defs>
        <rect x="0" y="80" width="960" height="448" fill="#ecebe7"/>
        <path d="M152,188 L172,188 Q180,188 180,180 L180,152 Q180,144 188,144 L208,144" fill="none" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><path d="M152,212 L172,212 Q180,212 180,220 L180,248 Q180,256 188,256 L208,256" fill="none" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><path d="M368,144 L388,144 Q396,144 396,152 L396,180 Q396,188 404,188 L424,188" fill="none" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><path d="M368,256 L388,256 Q396,256 396,248 L396,220 Q396,212 404,212 L424,212" fill="none" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><line x1="564" y1="200" x2="620" y2="200" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><line x1="690" y1="232" x2="690" y2="332" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><line x1="610" y1="380" x2="540" y2="380" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><line x1="770" y1="380" x2="808" y2="380" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><rect x="698" y="276" width="44" height="12" rx="2" fill="#ecebe7"/><text x="720" y="285" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">SCORES</text><rect x="561" y="360" width="28" height="12" rx="2" fill="#ecebe7"/><text x="575" y="369" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="779" y="360" width="20" height="12" rx="2" fill="#ecebe7"/><text x="789" y="369" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="32" y="168" width="120" height="64" rx="6" fill="#ecebe7"/><rect x="32" y="168" width="120" height="64" rx="6" fill="#5d683a" fill-opacity="0.10" stroke="#4f5a2c" stroke-width="1"/><text x="92" y="204" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Question</text><rect x="208" y="112" width="160" height="64" rx="6" fill="#ecebe7"/><rect x="208" y="112" width="160" height="64" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="288" y="141" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Search by meaning</text><text x="288" y="157" fill="#4f5a2c" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">30 passages, vector store</text><rect x="208" y="224" width="160" height="64" rx="6" fill="#ecebe7"/><rect x="208" y="224" width="160" height="64" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="288" y="253" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Search by words</text><text x="288" y="269" fill="#4f5a2c" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">30 passages, BM25</text><rect x="424" y="168" width="140" height="64" rx="6" fill="#ecebe7"/><rect x="424" y="168" width="140" height="64" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="494" y="197" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Merge the lists</text><text x="494" y="213" fill="#4f5a2c" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">reciprocal rank fusion</text><rect x="620" y="168" width="140" height="64" rx="6" fill="#ecebe7"/><rect x="620" y="168" width="140" height="64" rx="6" fill="#38450f" stroke="#38450f" stroke-width="1.2"/><text x="690" y="197" fill="#ecebe7" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Rerank</text><text x="690" y="213" fill="#ecebe7" fill-opacity="0.88" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">reads the best 10 pairs</text><rect x="380" y="348" width="160" height="64" rx="6" fill="#ecebe7"/><rect x="380" y="348" width="160" height="64" rx="6" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="460" y="384" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Best 3 go in the prompt</text><rect x="808" y="348" width="128" height="64" rx="6" fill="#ecebe7"/><rect x="808" y="348" width="128" height="64" rx="6" fill="#38450f" fill-opacity="0.03" stroke="#5d683a" stroke-width="1" stroke-dasharray="4,3"/><text x="872" y="377" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">No documents</text><text x="872" y="393" fill="#4f5a2c" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">the model says so</text><polygon points="690,332 770,380 690,428 610,380" fill="#ecebe7"/><polygon points="690,332 770,380 690,428 610,380" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="690" y="378" fill="#38450f" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Relevant enough?</text><text x="690" y="394" fill="#4f5a2c" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">cutoff -8.5</text>
        <line x1="24" y1="460" x2="936" y2="460" stroke="#38450f" stroke-opacity="0.14" stroke-width="0.8"/><text x="160.5" y="476" fill="#4f5a2c" font-size="8" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" letter-spacing="0.14em">LEGEND</text><rect x="216.5" y="467" width="20" height="12" rx="3" fill="#5d683a" fill-opacity="0.10" stroke="#4f5a2c" stroke-width="1"/><text x="244.5" y="476" fill="#38450f" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Input</text><rect x="300.5" y="467" width="20" height="12" rx="3" fill="#38450f" stroke="#38450f" stroke-width="1"/><text x="328.5" y="476" fill="#38450f" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Decides what the model sees</text><rect x="507.5" y="467" width="20" height="12" rx="3" fill="#f6f5f1" stroke="#38450f" stroke-width="1"/><text x="535.5" y="476" fill="#38450f" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Step</text><rect x="585.5" y="467" width="20" height="12" rx="3" fill="#38450f" fill-opacity="0.03" stroke="#5d683a" stroke-width="1" stroke-dasharray="4,3"/><text x="613.5" y="476" fill="#38450f" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Nothing found</text><line x1="713.5" y1="473" x2="739.5" y2="473" stroke="#5d683a" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/><text x="749.5" y="476" fill="#38450f" font-size="9" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">Passes on</text>
      </svg>
