<svg viewBox="0 48 960 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Campus Copilot system architecture</title>
        <desc id="architecture-desc">The student's web app talks to an API that runs an agent, which uses a database, a knowledge store and a language model, while scheduled jobs and the agent send push notifications back to the device.</desc>
