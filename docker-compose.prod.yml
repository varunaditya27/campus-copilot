# Production: pulls the images that the "Build and publish images" workflow pushes to the GitHub
# Container Registry, and puts Caddy in front for HTTPS. Only ports 80 and 443 are published.
#
#   cp .env.example .env     # set DOMAIN, POSTGRES_PASSWORD, IMAGE_PREFIX
#   mkdir -p secrets && openssl rand -hex 32 > secrets/jwt_secret && printf '%s' "$GROQ_KEY" > secrets/groq_api_key
#   chmod 600 secrets/*   # the secrets folder is git-ignored
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# DOMAIN must already point at this machine (Caddy needs ports 80 and 443 reachable to get a certificate).
# The frontend image has the API address baked in: it must have been built with
# NEXT_PUBLIC_API_BASE_URL=https://<DOMAIN> (the repository variable of that name in GitHub).
services:
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX, for example ghcr.io/your-name/campus-copilot}-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://campus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/campus_copilot
      # Secrets are read from files (the ./secrets folder, mounted below), not from the environment, so they do not show in
      # `docker inspect` or a process list. Rotate one by replacing its file under ./secrets and running
      # `docker compose -f docker-compose.prod.yml up -d --force-recreate backend`.
      JWT_SECRET_FILE: /secrets/jwt_secret
      GROQ_API_KEY_FILE: /secrets/groq_api_key
      ADMIN_API_KEY_HASHES: ${ADMIN_API_KEY_HASHES:-}
      # Caddy is the only thing that can reach the backend, so the address it reports for the visitor can be trusted
      # (rate limits are per visitor address).
      FORWARDED_ALLOW_IPS: "*"
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-30/minute}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
      # One origin serves both the pages and the API, so no other origin is allowed.
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Campus Copilot <no-reply@campus.example>}
    volumes:
      # ':z' lets SELinux hosts read the folder. The files must be readable by the container's user (uid 1000):
      # owned by uid 1000 with mode 600, or mode 644 if your user has another uid.
      - ./secrets:/secrets:ro,z
      - campus_data:/var/lib/campus
      - model_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest:
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    entrypoint: ["python", "-m", "app.rag.ingest"]
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    volumes:
      - campus_data:/var/lib/campus
      - model_cache:/home/app/.cache
    restart: "no"

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campus_copilot
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  campus_data:
  model_cache:
  caddy_data:
  caddy_config:
