# The whole application, in containers:
#
#   cp .env.example .env     # then set POSTGRES_PASSWORD, JWT_SECRET and GROQ_API_KEY
#   docker compose up -d --build
#   docker compose exec backend python -m app.cli create-user --role admin --name "Your Name" --email you@example.org
#
# The backend waits for Postgres, applies the database migrations, loads the demo data into empty
# tables on start, after the one-shot ingest service has built the knowledge base. The search models (about 170 MB) are downloaded on
# the first start into the model_cache volume. Optional extras: the vector stores below (profiles
# chroma-server and qdrant) and the monitoring stack (profile monitoring).
#
# There are no celery-worker or celery-beat services: nothing in the application uses Celery yet
# (notifications and background jobs are a later phase), so idle workers would only mislead.
#
# Run locally without Postgres: the backend falls back to a SQLite file when DATABASE_URL is not set.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    image: ${IMAGE_PREFIX:-campus-copilot}-backend:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://campus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/campus_copilot
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_MODEL_BEST: ${LLM_MODEL_BEST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MULTI_AGENT: ${MULTI_AGENT:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Campus Copilot <no-reply@campus.example>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - campus_data:/var/lib/campus
      - model_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  # Builds the knowledge base before the backend starts: the first time it downloads the search
  # models, which takes a few minutes; afterwards only documents that changed are redone.
  ingest:
    image: ${IMAGE_PREFIX:-campus-copilot}-backend:${IMAGE_TAG:-local}
    entrypoint: ["python", "-m", "app.rag.ingest"]
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - campus_data:/var/lib/campus
      - model_cache:/home/app/.cache
    restart: "no"

  frontend:
    build:
      context: frontend
      target: runtime
      args:
        # Baked into the browser code at build time: the address the browser uses to reach the backend.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: ${IMAGE_PREFIX:-campus-copilot}-frontend:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Shared state for the rate limiter, so limits hold when there are several backend processes.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: campus_copilot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps its version-specific data directory under this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional vector stores for the knowledge base. Without either, the backend
  # keeps Chroma's files on disk. Start one with its profile, for example
  #   docker compose --profile qdrant up -d qdrant
  # and point the backend at it (CHROMA_HOST, or VECTOR_STORE=qdrant). Neither
  # has authentication enabled, so they listen on localhost only.
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["chroma-server"]
    ports:
      - "127.0.0.1:${CHROMA_SERVER_PORT:-8100}:8000"
    volumes:
      - chroma_data:/data

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Monitoring (docker compose --profile monitoring up -d). Prometheus keeps the backend's metrics,
  # Grafana draws them (http://localhost:3001, admin / the GRAFANA_PASSWORD you set), and Jaeger shows
  # traces (http://localhost:16686) once OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 is set for the backend.
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["monitoring"]
    volumes:
      # ":z" lets SELinux hosts (Fedora, RHEL) read a mounted file; other systems ignore it.
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.11
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  qdrant_data:
  campus_data:
  model_cache:
  prometheus_data:
  grafana_data:
