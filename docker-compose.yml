# PostgreSQL for production-style runs. Local development works without it:
# the backend falls back to a SQLite file when DATABASE_URL is not set.
#
#   POSTGRES_PASSWORD=choose-a-password docker compose up -d postgres
#   DATABASE_URL=postgresql+psycopg://campus:choose-a-password@localhost:5432/campus_copilot
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: campus_copilot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps its version-specific data directory under this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional vector stores for the knowledge base. Without either, the backend
  # keeps Chroma's files on disk. Start one with its profile, for example
  #   docker compose --profile qdrant up -d qdrant
  # and point the backend at it (CHROMA_HOST, or VECTOR_STORE=qdrant). Neither
  # has authentication enabled, so they listen on localhost only.
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["chroma-server"]
    ports:
      - "127.0.0.1:${CHROMA_SERVER_PORT:-8100}:8000"
    volumes:
      - chroma_data:/data

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  chroma_data:
  qdrant_data:
